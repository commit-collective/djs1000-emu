name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check shell syntax
        run: bash -n scripts/setup.sh
      - name: Exercise setup with synthetic fixtures
        run: python tools/test_setup.py
