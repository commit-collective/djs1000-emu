name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check shell syntax
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/run.sh
      - name: Exercise setup with synthetic fixtures
        run: python tools/test_setup.py

  launcher:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check launcher ownership
        run: python tools/test_launcher.py
      - name: Check adapter selection without firmware
        run: python tools/test_network.py
      - name: Exercise virtual deck controls
        run: python tools/deck_selftest.py
